[package]
name = "rvepp"
version = "2024.7.0"
edition = "2021"
publish = false

[workspace]
members = [
    "crates/rvepp_protection_layers", "crates/rvepp_configuration", "crates/rvepp_common", "crates/rvepp_cli", "crates/rvepp_cmdl_args", "crates/rvepp_ml"]

[workspace.package]
version = "2024.7.0"

[target.'cfg(unix)'.dependencies]
rvepp_cli = { path = "crates/rvepp_cli" }
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
